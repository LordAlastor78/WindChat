[package]
name = "relay-rust"
version = "1.0.0"
edition = "2021"
description = "WindChat E2EE relay (Rust, offline sidecar)"
license = "AGPL-3.0"

[[bin]]
name = "relay-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
base64 = "0.22"
anyhow = "1"
