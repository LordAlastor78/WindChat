[package]
name = "fugazchat-desktop"
version = "1.0.0"
description = "FugazChat desktop shell (Tauri) — E2EE chat con relay Rust local"
authors = ["WindChat"]
license = "AGPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# Por defecto nada extra; el launcher arranca el relay sidecar.
default = []
