<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WindChat - Chat</title>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #f4fbff;
            --bg-secondary: #e6f7ff;
            --text-primary: #0a192f;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --card-bg: rgba(255, 255, 255, 0.7);
            --border-color: rgba(0, 0, 0, 0.05);
            --chat-bg: #ffffff;
            --message-me: #38bdf8;
            --message-other: #e5e7eb;
        }

        [data-theme="dark"] {
            --bg-primary: #0b1120;
            --bg-secondary: #111827;
            --text-primary: #e6f7ff;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --card-bg: rgba(17, 24, 39, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --chat-bg: #1f2937;
            --message-me: #0ea5e9;
            --message-other: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', monospace;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        .hidden { display: none; }

        .app {
            width: 100%;
            max-width: 1100px;
            height: 100vh;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: auto;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--chat-bg);
        }

        .chat-brand {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .theme-toggle {
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            max-width: 70%;
            padding: 0.7rem 1rem;
            border-radius: 15px;
            position: relative;
            font-size: 0.9rem;
        }

        .message.me {
            align-self: flex-end;
            background: var(--message-me);
            color: white;
        }

        .message.other {
            align-self: flex-start;
            background: var(--message-other);
        }

        .input-area {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            gap: 0.5rem;
        }

        .input-area input {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .typing {
            font-size: 0.8rem;
            opacity: 0.7;
            padding-left: 1.5rem;
            padding-bottom: 0.5rem;
        }

        .login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            text-align: center;
        }

        .login-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .login-screen input {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            width: 250px;
            background: transparent;
            color: var(--text-primary);
        }

        .btn-primary {
            padding: 0.9rem 2rem;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background: var(--accent-strong);
            transform: translateY(-2px);
        }
    </style>
</head>
<body data-theme="light">

<div class="app" id="chatApp">
    <div class="chat-header">
        <div class="chat-brand">WindChat</div>
        <button class="theme-toggle">Cambiar Tema</button>
    </div>

    <div class="login-screen" id="loginScreen">
        <h2>Conéctate de forma segura</h2>
        <input type="text" id="username" placeholder="Room ID o crea uno..." />
        <button class="btn-primary">Comenzar Ahora</button>
    </div>

    <div class="chat-container hidden" id="chatContainer">
        <div class="messages" id="messages"></div>
        <div class="typing" id="typingIndicator"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." />
            <button class="icon-btn">➤</button>
        </div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
